<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Train Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-screen">
        <div class="eyelid eyelid-top"></div>
        <div class="eyelid eyelid-bottom"></div>

        <span id="stopwatch">00:00:00</span>
        <button type="button" id="wake-up-btn">Wake Up</button>
    </div>

    <div id="end-screen">
        <h2>So close!</h2>
        <p>You fell asleep, but your train departed before you woke up.</p>

        <p>You stayed awake for:</p>
        <span id="end-time">00:00:00</span>

        <button type="button" class="new-game-btn">Try Again?</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
