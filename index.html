<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Train Simulator</title>

    <meta name="description" content="A game that simulates the feeling of waiting for a train at midnight.">
    <meta property="og:title" content="Midnight Train Simulator">
    <meta property="og:description" content="A game that simulates the feeling of waiting for a train at midnight.">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="MTS-Icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="title-screen" class="screen">
        <h1>Midnight Train Simulator</h1>
        <p>How long can you wait for your train?</p>

        <button type="button" class="new-game-btn">Play</button>
    </div>

    <div id="game-screen" class="screen">
        <table aria-hidden="true" role="presentation">
            <thead>
                <tr>
                    <th colspan="2" class="board-larger">Departures</th>
                    <th colspan="2" class="board-larger"><span id="stopwatch">00:00:00</span></th>
                </tr>
                <tr>
                    <th>Time</th>
                    <th>Platform</th>
                    <th>Information</th>
                    <th>Destination</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>12:00 AM</td>
                    <td class="empty-data">-</td>
                    <td>Please Wait</td>
                    <td>Nowhere</td>
                </tr>
                <tr>
                    <td class="empty-data">-</td>
                    <td class="empty-data">-</td>
                    <td class="empty-data">-</td>
                    <td class="empty-data">-</td>
                </tr>
                <tr>
                    <td class="empty-data">-</td>
                    <td class="empty-data">-</td>
                    <td class="empty-data">-</td>
                    <td class="empty-data">-</td>
                </tr>
                <tr>
                    <td class="empty-data">-</td>
                    <td class="empty-data">-</td>
                    <td class="empty-data">-</td>
                    <td class="empty-data">-</td>
                </tr>
            </tbody>
        </table>

        <div class="eyelid eyelid-top"></div>
        <div class="eyelid eyelid-bottom"></div>

        <button type="button" id="wake-up-btn">
            <i class="fa-solid fa-eye"></i>
        </button>
    </div>

    <div id="end-screen" class="screen">
        <div class="end-group">
            <h2>So close!</h2>
            <p>You fell asleep, but your train departed before you woke up.</p>
        </div>

        <div class="end-group">
            <p>You stayed awake for:</p>
            <span id="end-time">00:00:00</span>

            <button type="button" class="new-game-btn">Try Again?</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
